services:
  postgres:
    image: postgres:16
    container_name: db-pdv
    environment:
      - POSTGRES_DB=pdv
      - POSTGRES_USER=savio
      - POSTGRES_PASSWORD=savio
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pdv_network

  adminer:
    image: adminer:6.1.0
    container_name: adminer_pdv
    ports:
      - "8050:8080"
    depends_on:
      - postgres
    networks:
      - pdv_network

volumes:
  postgres_data:

networks:
  pdv_network: